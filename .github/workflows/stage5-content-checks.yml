name: Stage 5 Member 2 thirteen-concept workset

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage5-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: backend
      LLM_ENABLED: 'false'
      AUTHORING_LLM_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Verify Member 2 scope and approved dataset artifacts
        run: |
          python scripts/retrieval/prepare_member2_stage5.py --check
          python scripts/retrieval/curate_stage5.py check
          python scripts/kb/build_member2_stage3_assets.py --check
      - name: Test thirteen-concept coverage, review integrity and publication boundaries
        run: >-
          python -m pytest tests/test_member2_stage5.py tests/test_curriculum.py
          tests/test_kb_unit.py tests/test_stage3_completion.py tests/test_member2_authoring_pipeline.py
          -q --junitxml=artifacts/stage5-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage5-member2-offline-evidence
          path: artifacts/stage5-tests.xml
