name: Repository checks

on:
  push:
    branches: [main, tiendatv1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: repository-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: mo_test
          POSTGRES_USER: mo_test
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mo_test -d mo_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGDATABASE: mo_test
      PGUSER: mo_test
      PGPASSWORD: ci-test-only
      RUN_DB_TESTS: '1'
      DEMO_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check JavaScript syntax
        run: node --check design/app.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            research/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check Python syntax
        run: python3 -m py_compile design/audit_ui.py scripts/checks/check_repository.py
      - name: Check tracked files and documentation links
        run: |
          python3 scripts/checks/check_release_inputs.py
          python3 scripts/checks/check_repository.py
      - name: Install foundation test dependencies
        run: python3 -m pip install -r backend/requirements-dev.txt -r research/requirements.txt
      - name: Check content, schemas and foundation behavior
        run: |
          python3 scripts/checks/check_phase1.py
          python3 scripts/checks/check_curriculum.py
          python3 scripts/checks/check_member2_foundation.py
          python3 scripts/checks/check_authoring.py
          python3 scripts/exports/export_contracts.py --check
          python3 scripts/exports/export_phase3_openapi.py --check
          python3 scripts/exports/export_frontend_types.py --check
          python3 scripts/exports/export_kb_contracts.py --check
          python3 scripts/kb/build_member2_stage3_assets.py --check
          python3 scripts/checks/check_stage3_kb.py
          python3 scripts/checks/check_current_release.py --junitxml artifacts/ci-tests.xml
      - name: Build backend image with CPU retrieval dependencies
        run: docker build --build-arg INSTALL_RAG=true -f backend/Dockerfile -t mo-tutor-stage3:ci .
      - name: Check packaged 13-concept KB assets
        run: >-
          docker run --rm --entrypoint python mo-tutor-stage3:ci -c
          "from app.kb_projection import load_source,load_example_publications,load_profile,project;
          r,b,o=load_source('member2-v2');
          p=project(r,b,load_profile(),origin=o,examples=load_example_publications('member2-v2'));
          assert len(b.packs)==13 and len(p.chunks)==91 and not p.blocked;
          print('13 approved packs, 91 packaged chunks')"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck and build frontend
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm test
          npm run typecheck
          npm run build
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-checks-evidence
          path: artifacts/ci-tests.xml
