name: Repository checks

on:
  push:
    branches: [main, tiendatv1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: repository-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/ci-graph-only
          NEO4J_server_memory_heap_initial__size: 256m
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 256m
        ports:
          - 7474:7474
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:7474 || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 25
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-bookworm
        env:
          POSTGRES_DB: mo_test
          POSTGRES_USER: mo_test
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mo_test -d mo_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGDATABASE: mo_test
      PGUSER: mo_test
      PGPASSWORD: ci-test-only
      RUN_DB_TESTS: '1'
      RUN_GRAPH_TESTS: '1'
      RUN_RAG_DB_TESTS: '1'
      NEO4J_HTTP_URL: http://localhost:7474
      NEO4J_PASSWORD: ci-graph-only
      DEMO_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check JavaScript syntax
        run: node --check design/app.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            research/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check Python syntax
        run: python3 -m py_compile design/audit_ui.py scripts/checks/check_repository.py
      - name: Check tracked files and documentation links
        run: python3 scripts/checks/check_repository.py
      - name: Install foundation test dependencies
        run: python3 -m pip install -r backend/requirements-dev.txt -r research/requirements.txt
      - name: Check content, schemas and foundation behavior
        run: |
          python3 scripts/checks/check_phase1.py
          python3 scripts/checks/check_curriculum.py
          python3 research/analyzer/evaluate.py
          python3 scripts/exports/prepare_retrieval_colab.py
          python3 research/retrieval/evaluate.py
          python3 scripts/exports/export_contracts.py --check
          python3 scripts/exports/export_phase3_openapi.py --check
          python3 scripts/exports/export_pilot_openapi.py --check
          python3 -m pytest tests -q
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck and build frontend
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm run typecheck
          npm run build
